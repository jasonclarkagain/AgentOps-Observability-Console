kind = "web"
previewPath = "/"
title = "AgentOps"
description = "An observability console for autonomous systems that traces agent reasoning chains, tool calls, costs, business outcomes, anomalies, and replayable runs."
version = "1.0.0"
id = "artifacts/agentops"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20962

[services.development]
run = "pnpm --filter @workspace/agentops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agentops", "run", "build" ]
serve = "static"
publicDir = "artifacts/agentops/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20962"
BASE_PATH = "/"
