openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AgentOps observability and telemetry API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Cross-run observability summaries
  - name: runs
    description: Agent execution runs and replay
  - name: anomalies
    description: Agent behavior anomalies
  - name: telemetry
    description: Semantic MCP telemetry ingestion
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get observability summary
      description: Returns headline metrics and trend data for the AgentOps workspace
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: List agent runs
      description: Returns recent runs with optional status and text filters
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, completed, running, failed, anomalous]
            default: all
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Agent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRun"
  /runs/{runId}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Get an agent run
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /runs/{runId}/events:
    get:
      operationId: getRunEvents
      tags: [runs]
      summary: Get a run's semantic trace
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered semantic trace events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraceEvent"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /runs/{runId}/replay:
    post:
      operationId: replayRun
      tags: [runs]
      summary: Create a replay of a captured run
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayInput"
      responses:
        "202":
          description: Replay created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayResponse"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /anomalies:
    get:
      operationId: listAnomalies
      tags: [anomalies]
      summary: List detected anomalies
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, acknowledged, resolved, all]
            default: open
      responses:
        "200":
          description: Detected anomalies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Anomaly"
  /telemetry/events:
    post:
      operationId: ingestTelemetryEvent
      tags: [telemetry]
      summary: Ingest one semantic telemetry event
      description: Accepts an MCP-shaped event with agent-specific semantics such as reasoning, tool execution, correction, or final output
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryEventInput"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryIngestResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    MetricPoint:
      type: object
      properties:
        label:
          type: string
        value:
          type: number
      required: [label, value]
    DashboardSummary:
      type: object
      properties:
        activeRuns:
          type: integer
        totalRuns:
          type: integer
        successRate:
          type: number
        totalCost:
          type: number
        avgCost:
          type: number
        openAnomalies:
          type: integer
        avgLatencyMs:
          type: integer
        costTrend:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
        outcomeTrend:
          type: array
          items:
            $ref: "#/components/schemas/MetricPoint"
      required:
        - activeRuns
        - totalRuns
        - successRate
        - totalCost
        - avgCost
        - openAnomalies
        - avgLatencyMs
        - costTrend
        - outcomeTrend
    AgentRun:
      type: object
      properties:
        id:
          type: string
        agentName:
          type: string
        workflow:
          type: string
        status:
          type: string
          enum: [completed, running, failed, anomalous]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        durationMs:
          type: integer
        eventCount:
          type: integer
        toolCallCount:
          type: integer
        totalTokens:
          type: integer
        cost:
          type: number
        outcome:
          type: string
        outcomeScore:
          type: number
        customer:
          type: string
        model:
          type: string
        hasAnomaly:
          type: boolean
      required:
        - id
        - agentName
        - workflow
        - status
        - startedAt
        - completedAt
        - durationMs
        - eventCount
        - toolCallCount
        - totalTokens
        - cost
        - outcome
        - outcomeScore
        - customer
        - model
        - hasAnomaly
    TraceEvent:
      type: object
      properties:
        id:
          type: string
        runId:
          type: string
        parentId:
          type: ["string", "null"]
        sequence:
          type: integer
        type:
          type: string
          enum: [reasoning, tool_call, tool_result, context, correction, output]
        title:
          type: string
        detail:
          type: string
        timestamp:
          type: string
          format: date-time
        durationMs:
          type: integer
        tokens:
          type: integer
        cost:
          type: number
        status:
          type: string
          enum: [complete, warning, error]
        metadata:
          type: object
          additionalProperties: true
      required:
        - id
        - runId
        - parentId
        - sequence
        - type
        - title
        - detail
        - timestamp
        - durationMs
        - tokens
        - cost
        - status
        - metadata
    Anomaly:
      type: object
      properties:
        id:
          type: string
        runId:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        title:
          type: string
        description:
          type: string
        detectedAt:
          type: string
          format: date-time
        signal:
          type: string
        status:
          type: string
          enum: [open, acknowledged, resolved]
        stepCount:
          type: integer
        expectedSteps:
          type: integer
      required:
        - id
        - runId
        - severity
        - title
        - description
        - detectedAt
        - signal
        - status
        - stepCount
        - expectedSteps
    ReplayInput:
      type: object
      properties:
        fromSequence:
          type: integer
          minimum: 1
        toSequence:
          type: integer
          minimum: 1
        useOriginalContext:
          type: boolean
          default: true
    ReplayResponse:
      type: object
      properties:
        replayId:
          type: string
        runId:
          type: string
        status:
          type: string
          enum: [queued, running, completed]
        message:
          type: string
      required: [replayId, runId, status, message]
    TelemetryEventInput:
      type: object
      properties:
        runId:
          type: string
        parentId:
          type: ["string", "null"]
        type:
          type: string
          enum: [reasoning, tool_call, tool_result, context, correction, output]
        title:
          type: string
        detail:
          type: string
        timestamp:
          type: ["string", "null"]
          format: date-time
        durationMs:
          type: integer
          minimum: 0
        tokens:
          type: integer
          minimum: 0
        cost:
          type: number
          minimum: 0
        metadata:
          type: object
          additionalProperties: true
      required: [runId, type, title, detail]
    TelemetryIngestResponse:
      type: object
      properties:
        accepted:
          type: boolean
        eventId:
          type: string
        sequence:
          type: integer
        semanticType:
          type: string
      required: [accepted, eventId, sequence, semanticType]

